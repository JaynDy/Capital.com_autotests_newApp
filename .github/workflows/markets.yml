name: Markets Tests

on:
  push:
    branches: [main, master, dev, "ci/**"]
  pull_request:
    branches: [main, master, dev, "ci/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. TESTS
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        license: [FCA, ASIC, CMA, SCB, CySEC]
        browser: [chromium]

    env:
      CI: true
      TEST_BROWSER: ${{ matrix.browser }}
      TEST_LICENSE: ${{ matrix.license }}
      TEST_USER: unauthorised,unregistered

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: npm ci
      - run: npx playwright install --with-deps

      - name: Clean old test results
        run: rm -rf allure-results allure-report test-results

      - name: Run tests
        run: npm run test:markets

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.license }}
          path: allure-results/
          if-no-files-found: warn

  # 2. REPORT (single job)
  report:
    needs: test
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Clean old report files
        run: rm -rf allure-results merged-results allure-report public

      - name: Download all allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: false

      - name: Merge results
        run: |
          mkdir -p merged-results
          find allure-results -type f -exec cp -n {} merged-results/ \;

      - name: Install Allure
        run: npm install -g allure-commandline

      - name: Generate Allure report
        run: allure generate merged-results -o allure-report --clean

      # 3. DEPLOY MARKETS REPORT ONLY
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update Markets report
        run: |
          rm -rf gh-pages/markets
          mkdir -p gh-pages/markets

          cp -R allure-report/. gh-pages/markets/

          cd gh-pages

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Update Markets Allure report"
            git push origin HEAD:gh-pages
          fi

